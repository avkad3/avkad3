<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="PyCodeAtlas — Static analysis CLI that maps a codebase&#x27;s dependency graph, classifies dead code and shows what breaks if you delete a function or module. Built with Python, AST, NetworkX, D3.js, SQLite."><title>PyCodeAtlas — Static analysis CLI that maps a codebase&#x27;s dependency graph, classifies dead code and shows what breaks if you delete a function or module. Built with Python, AST, NetworkX, D3.js, SQLite.</title><defs><style>@font-face{font-family:'monob';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'mono';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'display5';src:url(data:font/woff2;base64,) format('woff2');}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@keyframes drawl{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}@keyframes lamp{0%{opacity:1}33%,100%{opacity:.2}}@keyframes stepon{0%,10%{stroke:#333;fill:#0b0b0b}15%,60%{stroke:#3DF2A6;fill:#3DF2A6}70%,100%{stroke:#333;fill:#0b0b0b}}@keyframes grow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}@keyframes gauge{from{stroke-dashoffset:157}to{stroke-dashoffset:30}}@keyframes scanbox{0%{transform:translate(0,0)}25%{transform:translate(72px,0)}50%{transform:translate(72px,22px)}75%{transform:translate(24px,22px)}100%{transform:translate(0,0)}}@keyframes sweep{to{stroke-dashoffset:-2400}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern><radialGradient id="cg" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#3DF2A6" stop-opacity=".10"/><stop offset="1" stop-color="#3DF2A6" stop-opacity="0"/></radialGradient><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#3DF2A6" stop-opacity="0"/><stop offset=".5" stop-color="#3DF2A6"/><stop offset="1" stop-color="#5AB8FF" stop-opacity=".2"/></linearGradient></defs><rect width="800" height="400" rx="16" fill="#080808"/><rect x=".5" y=".5" width="799" height="399" rx="15.5" fill="none" stroke="#222222"/><rect width="800" height="400" rx="16" fill="url(#cg)"/><rect x="1" y="1" width="798" height="398" rx="15" fill="none" stroke="#3DF2A6" stroke-width="1.6" stroke-dasharray="288 2112" style="animation:sweep 7s linear -0.9s infinite" stroke-linecap="round" opacity=".85"/><text xml:space="preserve" x="40.0" y="58.0" font-family="monob" font-size="15" fill="#3DF2A6" letter-spacing="2">001</text><line x1="86" x2="118" y1="53" y2="53" stroke="#333"/><text xml:space="preserve" x="130.0" y="58.0" font-family="mono" font-size="14" fill="#8A8A8A" letter-spacing="2.2">PUBLISHED · PYPI</text><g transform="translate(640,34)"><line x1="10" y1="35" x2="45" y2="12" stroke="#333"/><line x1="10" y1="35" x2="45" y2="58" stroke="#333"/><line x1="45" y1="12" x2="85" y2="22" stroke="#333"/><line x1="45" y1="58" x2="85" y2="50" stroke="#333"/><line x1="85" y1="22" x2="115" y2="35" stroke="#333"/><line x1="85" y1="50" x2="115" y2="35" stroke="#333"/><line x1="45" y1="12" x2="85" y2="50" stroke="#333"/><circle cx="10" cy="35" r="5" fill="#0b0b0b" stroke="#3DF2A6" stroke-width="1.6" style=""/><circle cx="45" cy="12" r="4" fill="#0b0b0b" stroke="#8A8A8A" stroke-width="1.6" style=""/><circle cx="45" cy="58" r="4" fill="#0b0b0b" stroke="#8A8A8A" stroke-width="1.6" style=""/><circle cx="85" cy="22" r="4" fill="#0b0b0b" stroke="#8A8A8A" stroke-width="1.6" style=""/><circle cx="85" cy="50" r="5" fill="#0b0b0b" stroke="#FF5C5C" stroke-width="1.6" style="animation:pulse 1.4s ease-in-out infinite"/><circle cx="115" cy="35" r="4" fill="#0b0b0b" stroke="#8A8A8A" stroke-width="1.6" style=""/></g><text xml:space="preserve" x="40.0" y="150.0" font-family="display" font-size="50" fill="#F5F5F5" letter-spacing="-1.6">PyCodeAtlas</text><text xml:space="preserve" x="40.0" y="200.0" font-family="display5" font-size="22" fill="#a8a8a8">Static analysis CLI that maps a codebase&#x27;s dependency graph,</text><text xml:space="preserve" x="40.0" y="232.0" font-family="display5" font-size="22" fill="#a8a8a8">classifies dead code and shows what breaks if you delete a</text><text xml:space="preserve" x="40.0" y="264.0" font-family="display5" font-size="22" fill="#a8a8a8">function or module.</text><rect x="40" y="296" width="84" height="34" rx="17" fill="#0f0f0f" stroke="#2a2a2a"/><text xml:space="preserve" x="54.0" y="318.5" font-family="mono" font-size="15.5" fill="#bdbdbd">Python</text><rect x="133.79999999999998" y="296" width="56" height="34" rx="17" fill="#0f0f0f" stroke="#2a2a2a"/><text xml:space="preserve" x="147.8" y="318.5" font-family="mono" font-size="15.5" fill="#bdbdbd">AST</text><rect x="199.7" y="296" width="102" height="34" rx="17" fill="#0f0f0f" stroke="#2a2a2a"/><text xml:space="preserve" x="213.7" y="318.5" font-family="mono" font-size="15.5" fill="#bdbdbd">NetworkX</text><rect x="312.09999999999997" y="296" width="74" height="34" rx="17" fill="#0f0f0f" stroke="#2a2a2a"/><text xml:space="preserve" x="326.1" y="318.5" font-family="mono" font-size="15.5" fill="#bdbdbd">D3.js</text><rect x="396.59999999999997" y="296" width="84" height="34" rx="17" fill="#0f0f0f" stroke="#2a2a2a"/><text xml:space="preserve" x="410.6" y="318.5" font-family="mono" font-size="15.5" fill="#bdbdbd">SQLite</text><line x1="40" x2="760" y1="350" y2="350" stroke="#222222"/><text xml:space="preserve" x="40.0" y="379.0" font-family="mono" font-size="14" fill="#5A5A5A">↗ github.com/avkad3/CodeAtlas</text><text xml:space="preserve" x="760.0" y="379.0" font-family="monob" font-size="14" fill="#3DF2A6" text-anchor="end">$ pip install pycodeatlas</text></svg>